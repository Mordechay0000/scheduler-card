name: Test

# Browser tests for the card. They drive the real custom elements in
# Chromium, since most of what can break here is layout and pointer
# behaviour rather than pure logic.

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - '.github/workflows/test.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run rollup

      - name: Run tests
        run: npm test
